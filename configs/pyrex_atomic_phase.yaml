# Atomic-phase reconstruction test on the PYREX 4D-STEM HDF5 scan.
#
# Data loading, calibration and model settings are IDENTICAL to
# configs/pyrex_smoke.yaml -- only the per-stage iteration counts and the output
# directory change.  runs/pyrex_smoke is never touched.
#
# probe_energy: SOURCE-CONFIRMED for this simulation dataset.

device:
  gpu_id: 0            # pinned per-process by CUDA_VISIBLE_DEVICES
  default_device: gpu
  build_device: cpu

data:
  raw_path: PTYREX_8_FOV5.0nm_def0nm_alpha25.0mrad_dx0.020nm_R256x256_Q256x256_CL0.00082m_ro73deg_trueCL87.h5
  group: data
  dataset: frames
  name: pyrextBL
  scan_shape: [256, 256]
  dp_shape: [256, 256]
  dtype: float32
  autodetect_axes: true
  transpose_dp: false
  flip_dp_x: false
  flip_dp_y: false
  # 64 x 64 scan positions, 192 x 192 diffraction pixels (same as the smoke run).
  scan_crop: [96, 160, 96, 160]
  dp_crop: [32, 224, 32, 224]
  # detector/dp_resolution = 1.2155 mrad/pixel; BF_radius_pixels 20.57 * that
  # = 25.0 mrad == alpha, so the calibration is self-consistent.
  dp_sampling_mrad: 1.2154998186711752

experiment:
  probe_energy: 300000.0     # eV - SOURCE-CONFIRMED
  probe_semiangle: 25.0      # mrad (alpha in the file name)
  probe_defocus: 0.0         # Angstrom (scan/defocus_nm = 0)
  scan_step_size: 0.1953125  # Angstrom = scan/scale 0.01953125 nm

model:
  num_probes: 6
  num_slices: 16
  slice_thickness: 20.0
  obj_type: potential

preprocess:
  com_fit_function: constant
  force_com_rotation: 73.0   # detector/py4dstem_rot
  plot_rotation: false
  plot_com: false
  obj_padding_px: [16, 16]
  batch_size: 64
  bf_radius_pad: 2.0
  df_inner_pad: 10.0
  df_outer_factor: 2.5

dip:
  obj_pretrain_iters: 200
  probe_pretrain_iters: 50
  pretrain_lr: 0.005
  obj_final_activation: softplus
  probe_start_filters: 32

analysis:
  center: [40, 40]
  phi: 20.0
  line_len: 30.0
  linewidth: 6.0
  cmap: viridis

output:
  dir: runs/pyrex_atomic_phase_test
  save_arrays: true
  save_figures: true
  show: false

stages:
  - name: pixelated_baseline
    kind: pixelated
    num_iters: 20
    reset: true
    batch_size: 64
    preprocess_batch_size: 64
    optimizer:
      optimizer: Adam
      scheduler: Plateau
      object_lr: 0.0001
      probe_lr: 1.0
    constraints:
      identical_slices: true
      fix_potential_baseline: true
      fix_potential_baseline_factor: 0.75

  - name: pixelated_baseline_extra
    kind: pixelated
    init_from: pixelated_baseline
    num_iters: 30
    batch_size: 64
    show_obj: true

  - name: pixelated_free
    kind: pixelated
    init_from: pixelated_baseline_extra
    num_iters: 20
    batch_size: 64
    optimizer:
      optimizer: Adam
      scheduler: Plateau
      object_lr: 0.0001
      probe_lr: 1.0
    constraints:
      identical_slices: false
      fix_potential_baseline: true
      positivity_mode: shrink
      fix_potential_baseline_factor: 0.05

  - name: dip
    kind: dip
    init_from: pixelated_baseline_extra
    num_iters: 20
    reset: true
    build_device: gpu
    batch_size: 64
    optimizer:
      optimizer: AdamW
      scheduler: Plateau
      object_lr: 0.001
      probe_lr: 0.001
    constraints:
      identical_slices: true
      fix_potential_baseline: true
      fix_potential_baseline_factor: 1.0

  - name: dip_free
    kind: dip
    init_from: dip
    num_iters: 30
    batch_size: 64
    optimizer:
      optimizer: AdamW
      scheduler: Plateau
      object_lr: 0.001
      probe_lr: 0.001
    constraints:
      identical_slices: false
      fix_potential_baseline: true
      fix_potential_baseline_factor: 1.0
      tv_weight_z: 5.0
      surface_zero_weight: 10.0

  - name: dip_free_extra
    kind: dip
    init_from: dip_free
    num_iters: 50
    batch_size: 64
